---
name: Index Wallpapers
on:
  workflow_dispatch:
jobs:
  index-wallpapers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: '1'
      - name: Index wallpapers and update README
        shell: bash
        run: |
          START_TAG="<!-- wallpapers:start -->"
          END_TAG="<!-- wallpapers:end -->"
          TMP="wallpapers_section.md"
          > "$TMP"
          direct_imgs=$(find wallpapers -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | sort)
          if [ -n "$direct_imgs" ]; then
            echo "## Uncategorized" >> "$TMP"
            echo "" >> "$TMP"
            echo "$direct_imgs" | while read -r img; do
              relpath="${img#wallpapers/}"
              repopath="wallpapers/$relpath"
              echo "<img src=\"./${repopath}\" alt=\"${relpath}\" width=\"300\" />" >> "$TMP"
              echo "" >> "$TMP"
            done
          fi
          find wallpapers -mindepth 1 -type d | sort | while read -r category_dir; do
            imgs=$(find "$category_dir" -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | sort)
            [ -z "$imgs" ] && continue
            category=$(basename "$category_dir")
            echo "## $category" >> "$TMP"
            echo "" >> "$TMP"
            echo "$imgs" | while read -r img; do
              relpath="${img#wallpapers/}"
              repopath="wallpapers/$relpath"
              echo "<img src=\"./${repopath}\" alt=\"${relpath}\" width=\"300\" />" >> "$TMP"
              echo "[View](./${repopath})" >> "$TMP"
              echo "" >> "$TMP"
            done
          done
          awk -v start="$START_TAG" -v end="$END_TAG" -v new="$(cat $TMP)" '
            BEGIN { in_section=0 }
            {
              if ($0 ~ start) { print; print new; in_section=1; next }
              if (in_section && $0 ~ end) { in_section=0 }
              if (!in_section) { print }
            }
          ' README.md > README.new.md
          mv README.new.md README.md
          rm "$TMP"
      - name: Commit changes to README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update README with indexed wallpapers
          file_pattern: README.md
